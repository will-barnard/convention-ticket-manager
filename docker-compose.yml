services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: convention_tickets
      POSTGRES_USER: postgres
      # Use DB_PASSWORD consistently across both apps. No silent default —
      # if it isn't set, fail fast at compose-up time rather than initialize
      # the volume with the literal string "password" and lock everyone out.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/convention_tickets
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    # No command override — server.js runs migrations + seeds itself before
    # listening, guarded by a postgres advisory lock so blue/green backends
    # don't race. The Dockerfile's CMD ["npm", "start"] runs unmodified.
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal

  verifier:
    build:
      context: ./verifier
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  postgres_data:
    name: convention-ticket-manager-postgres
  backend_uploads:
    name: convention-ticket-manager-uploads

networks:
  internal:
